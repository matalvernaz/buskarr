name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is what the image runs; 3.12 keeps the tests honest about the floor.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install mutagen
      - name: run test scripts
        run: |
          rc=0
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || rc=1
          done
          exit $rc
