name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is what the image runs; 3.12 keeps the tests honest about the floor.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The whole requirements file, not the one package the tests used to
      # need. `tests/test_api.py` imports fastapi, so from the commit that
      # added it every run has failed on an import -- which means the suite has
      # reported red for reasons that say nothing about the code under review,
      # and a genuine failure would have looked exactly the same.
      - run: pip install -r requirements.txt
      - name: run test scripts
        run: |
          rc=0
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || rc=1
          done
          exit $rc
